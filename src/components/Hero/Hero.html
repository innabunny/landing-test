<section class="hero" id="top">
  <div class="hero__container">
    <h1 class="hero__title" data-animate="fade-up">
      Все об&nbsp;онлайн-голосовании в&nbsp;Москве
    </h1>

    <div class="hero__graphics">
      <picture class="hero__picture" data-animate="zoom-in" data-delay="200">
        <source
          media="(max-width: 767px)"
          srcset="/images/portrait/Illustration-Head-Portrait.svg"
        />

        <img
          class="hero__image hero__image--main"
          src="/images/desktop/Illustration-login-form.svg"
          alt=""
        />
      </picture>

      <img
        class="hero__image hero__image--left"
        src="/images/desktop/lines-white-2.svg"
        alt=""
      />
    </div>
  </div>
</section>
