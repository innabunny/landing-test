<section class="voting-system" id="system">
  <div class="voting-system__container">
    <div class="voting-system__illustration" data-animate="fade-left">
      <img
        class="voting-system__image"
        src="/images/desktop/ILLUSTRATION-3.svg"
        alt=""
      />
    </div>

    <div class="voting-system__content">
      <h2
        class="voting-system__title"
        data-animate="fade-right"
        data-delay="100"
      >
        Как устроена система электронного голосования
      </h2>

      <p
        class="voting-system__description"
        data-animate="fade-right"
        data-delay="200"
      >
        Давайте рассмотрим по&nbsp;шагам, как устроена в&nbsp;Москве процедура
        электронного голосования, что происходит с&nbsp;нашими личными данными
        и&nbsp;результатом голосования.
      </p>

      <img
        class="voting-system__decoration"
        src="/images/desktop/lines-white-3.svg"
        alt=""
        aria-hidden="true"
      />
    </div>
  </div>
</section>
